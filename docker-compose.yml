services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: nexshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d nexshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/nexshop
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-32+}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENV: ${ENV:-development}
      AUTO_SEED: "true"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./app
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
