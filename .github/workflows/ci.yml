name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI · Py3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          AUTO_SEED: "false"
          AUTO_CREATE_TABLES: "true"
          JWT_SECRET: ci-secret-0123456789-0123456789-0123456789
      - name: Build Docker image
        run: docker build -t nexshop-api:ci .

  frontend:
    name: Frontend (Expo 57 · RN 0.86)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Export web bundle (Metro)
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ""
      - name: Docker build (web)
        run: |
          cd ..
          docker build -t nexshop-web:ci -f app/Dockerfile.web app

  docker-stack:
    name: Docker stack build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build compose images
        run: |
          docker compose build db api web
