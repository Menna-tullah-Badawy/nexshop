name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Inject white-label brand
        working-directory: app
        run: npm run brand
      - name: Export web bundle
        working-directory: app
        run: npx expo export --platform web
        env:
          # Set this as a GitHub repo Variable pointing to your API, e.g.
          # https://your-api.onrender.com/api
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      - name: SPA fallback for Pages
        working-directory: app
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
